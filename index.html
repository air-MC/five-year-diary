<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#FCFBF8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="다섯 해의 기록">
  <title>다섯 해의 기록</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="sage">
  <div class="app">
    <header class="top">
      <div class="when"><div class="date" data-testid="page-date"></div><div class="date-en"></div></div>
      <div class="toolbar" role="toolbar">
        <button class="tool" data-mode="pen" data-testid="tool-pen" aria-label="펜">
          <svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></button>
        <button class="tool size" data-testid="tool-size" aria-label="굵기"><span></span></button>
        <span class="colors"></span>
        <button class="tool" data-mode="eraser" data-testid="tool-eraser" aria-label="지우개">
          <svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4 15l9-9 6 6-7 7H8z"/></svg></button>
        <button class="tool" data-mode="keyboard" data-testid="tool-keyboard" aria-label="키보드">
          <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
        <button class="tool" data-testid="tool-undo" aria-label="실행취소">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
        <span class="save-state" data-testid="save-state"></span>
      </div>
      <div class="nav">
        <button class="pill" data-testid="prev" aria-label="전날">‹</button>
        <button class="pill" data-testid="today">오늘</button>
        <button class="pill" data-testid="next" aria-label="다음날">›</button>
        <button class="icon-btn" data-testid="open-index" aria-label="목록">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
        <button class="icon-btn" data-testid="open-settings" aria-label="설정">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
      </div>
    </header>

    <div class="banner" hidden data-testid="backup-banner"></div>

    <main class="body">
      <div class="stage" data-testid="stage"></div>
      <nav class="tabs" data-testid="tabs"></nav>
    </main>
  </div>

  <div class="sheet" id="index-sheet" hidden>
    <div class="sheet-card wide">
      <div class="sheet-head"><h2>목록</h2><button class="pill" data-close>닫기</button></div>
      <div class="months"></div>
      <div class="days"></div>
    </div>
  </div>

  <div class="sheet" id="settings-sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head"><h2>설정</h2><button class="pill" data-close>닫기</button></div>
      <section>
        <h3>색</h3>
        <div class="themes">
          <button data-theme-pick="sage"><i></i>세이지 그린</button>
          <button data-theme-pick="blue"><i></i>더스티 블루</button>
          <button data-theme-pick="rose"><i></i>로즈 베이지</button>
        </div>
      </section>
      <section>
        <h3>쓰기</h3>
        <label class="row"><span>손가락으로도 쓰기<small>애플펜슬이 없을 때 켜 주세요. 켜면 넘기기는 ‹ › 버튼으로 해요.</small></span>
          <input type="checkbox" data-testid="finger-draw"></label>
        <label class="row"><span>시작 연도<small>다섯 칸이 이 해부터 시작해요.</small></span>
          <input type="number" min="1900" max="2999" data-testid="start-year"></label>
      </section>
      <section>
        <h3>백업</h3>
        <p class="hint" data-testid="backup-info"></p>
        <div class="row-btns">
          <button class="primary" data-testid="backup-export">백업 파일 만들기</button>
          <button class="pill" data-testid="backup-import">백업에서 복원</button>
          <input type="file" accept="application/json,.json" hidden data-testid="backup-file">
        </div>
        <p class="hint">아이폰·아이패드: 백업 파일 만들기 → 공유 화면에서 <b>‘파일에 저장’</b> → iCloud Drive</p>
      </section>
    </div>
  </div>

  <div class="sheet" id="welcome-sheet" hidden>
    <div class="sheet-card welcome">
      <div class="mark">5</div>
      <h1>다섯 해의 기록</h1>
      <p class="en">FIVE YEAR DIARY</p>
      <p>하루 한 페이지, 같은 날짜의 다섯 해.<br>몇 년도부터 시작할까요?</p>
      <input type="number" min="1900" max="2999" data-testid="welcome-year">
      <button class="primary" data-testid="welcome-start">시작하기</button>
    </div>
  </div>

  <div class="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
